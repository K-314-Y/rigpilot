[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rigpilot"
version = "0.1.0"
description = "Safety-first orchestration foundation for Live2D Cubism workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.28,<2"]

[project.scripts]
rigpilot = "rigpilot.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.16"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/rigpilot"]
